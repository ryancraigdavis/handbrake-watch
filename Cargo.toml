[package]
name = "hbwatch"
version = "0.1.0"
edition = "2021"
description = "Watch folders and auto-transcode new media files with HandBrakeCLI, moving originals aside. Requires HandBrakeCLI to be installed."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryancraigdavis/handbrake-watch"
readme = "README.md"
keywords = ["handbrake", "transcode", "video", "encoding", "watcher"]
categories = ["command-line-utilities", "multimedia::video"]
exclude = ["handbrake-watcher-build-plan.md", "CLAUDE.md", ".claude/"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "sync", "time", "fs", "io-util", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
indicatif = "0.18.4"
axum = "0.8.9"
